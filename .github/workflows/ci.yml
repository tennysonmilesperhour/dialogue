name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copy-lint:
    name: Copy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce the voice rules
        run: python3 scripts/copy_lint.py

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  xcode:
    name: Xcode targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the app project
        run: xcodegen generate --spec project.yml --project .
      - name: Generate the prototype project
        run: >
          xcodegen generate
          --spec Prototype/CloseDetectionLab/project.yml
          --project Prototype/CloseDetectionLab
      - name: Build every target with the device SDK
        run: >
          xcodebuild build
          -project Dialogue.xcodeproj
          -scheme Dialogue
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Build the physical-device prototype
        run: >
          xcodebuild build
          -project Prototype/CloseDetectionLab/CloseDetectionLab.xcodeproj
          -scheme LabApp
          -configuration Debug
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  release-readiness:
    name: Full release verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify the release bundle
        run: scripts/verify_release.sh

  dialoguekit:
    name: DialogueKit tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: DialogueKit
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test
