name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copy-lint:
    name: Copy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce the voice rules
        run: python3 scripts/copy_lint.py

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  xcode:
    name: Xcode targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the app project
        run: xcodegen generate --spec project.yml --project .
      - name: Generate the prototype project
        run: >
          xcodegen generate
          --spec Prototype/CloseDetectionLab/project.yml
          --project Prototype/CloseDetectionLab
      - name: Build every target with the device SDK
        run: >
          xcodebuild build
          -project Dialogue.xcodeproj
          -scheme Dialogue
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Build the physical-device prototype
        run: >
          xcodebuild build
          -project Prototype/CloseDetectionLab/CloseDetectionLab.xcodeproj
          -scheme LabApp
          -configuration Debug
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  interface:
    name: iPhone interface tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Exercise the sample product and accessibility layouts
        run: scripts/verify_ui.sh
      - name: Preserve screenshots and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dialogue-interface-results
          path: work/*.xcresult

  release-readiness:
    name: Full release verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify the release bundle
        run: scripts/verify_release.sh

  dialoguekit:
    name: DialogueKit tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: DialogueKit
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test

  testflight:
    name: TestFlight upload
    # Every merge to main produces a build, once the signing secrets exist.
    # Without them the job reports why and does nothing, so the absence of
    # credentials never reads as a broken pipeline.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [copy-lint, web, xcode, dialoguekit, interface]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for signing credentials
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DIST_CERT_P12 DIST_CERT_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the upload. Missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Setup steps are in fastlane/README.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the build tools
        if: steps.signing.outputs.configured == 'true'
        run: |
          brew install xcodegen
          command -v fastlane >/dev/null || brew install fastlane
      - name: Build and upload to TestFlight
        if: steps.signing.outputs.configured == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DIALOGUE_BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: fastlane beta
