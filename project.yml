name: Dialogue

# The Xcode project is generated, never committed. `project.yml` is the
# source of truth so five targets, five bundle IDs, and five entitlement
# files cannot drift out of sync in a binary file nobody can review.
#
#   brew install xcodegen && xcodegen generate
#
# Phase 0 scaffold: every target compiles, links DialogueKit, and installs on
# a device. The gate, the debrief, and the ledger land in phase 2, after the
# week 1 prototype settles D012 (docs/PLAN.md).

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  DialogueKit:
    path: DialogueKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: T4PQ8SNY8D
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  Dialogue:
    type: application
    platform: iOS
    sources:
      - path: Dialogue/Sources
      - path: Dialogue/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dialogue.ios
        CODE_SIGN_ENTITLEMENTS: Dialogue/Dialogue.entitlements
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: dialogue
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Dialogue-Info.plist
      properties:
        # Standard HTTPS only, so the encryption question is settled here
        # rather than in the week 11 submission scramble.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [dialogue]
    dependencies:
      - package: DialogueKit
      - target: DialogueShield
        embed: true
      - target: DialogueShieldAction
        embed: true
      - target: DialogueMonitor
        embed: true
      - target: DialogueReport
        embed: true

  DialogueShield:
    type: app-extension
    platform: iOS
    sources:
      - path: DialogueShield/Sources
      - path: DialogueShield/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dialogue.ios.shield
        CODE_SIGN_ENTITLEMENTS: DialogueShield/DialogueShield.entitlements
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/DialogueShield-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    dependencies:
      - package: DialogueKit

  DialogueShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: DialogueShieldAction/Sources
      - path: DialogueShieldAction/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dialogue.ios.shieldaction
        CODE_SIGN_ENTITLEMENTS: DialogueShieldAction/DialogueShieldAction.entitlements
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/DialogueShieldAction-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    dependencies:
      - package: DialogueKit

  DialogueMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: DialogueMonitor/Sources
      - path: DialogueMonitor/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dialogue.ios.monitor
        CODE_SIGN_ENTITLEMENTS: DialogueMonitor/DialogueMonitor.entitlements
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/DialogueMonitor-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    dependencies:
      - package: DialogueKit

  DialogueReport:
    type: app-extension
    platform: iOS
    sources:
      - path: DialogueReport/Sources
      - path: DialogueReport/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dialogue.ios.report
        CODE_SIGN_ENTITLEMENTS: DialogueReport/DialogueReport.entitlements
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/DialogueReport-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    dependencies:
      - package: DialogueKit

schemes:
  Dialogue:
    build:
      targets:
        Dialogue: all
    run:
      config: Debug
    archive:
      config: Release
